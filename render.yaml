# Blueprint для render.com: веб-сервис + управляемый PostgreSQL.
# Render → Blueprints → New Blueprint Instance → выбрать этот репозиторий.

databases:
  - name: listoffilms-db
    databaseName: listoffilms
    user: listoffilms
    plan: free

services:
  - type: web
    name: listoffilms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: listoffilms-db
          property: connectionString
      # Render сгенерирует секрет сам — его не нужно хранить в репозитории.
      - key: SESSION_SECRET
        generateValue: true
      # Ключи лежат прямо здесь, чтобы блюпринт разворачивался без ручного
      # ввода. При перевыпуске ключей поменять их нужно и тут, и в .env.
      - key: TMDB_API_KEY
        value: d0ba895775d3a52470f3780f9e164d20
      - key: OMDB_API_KEY
        value: 7b47daab
